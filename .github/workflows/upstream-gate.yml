name: Upstream gate

# Runs on sync/upstream-* pull requests opened by the Sentinel-Labs fleet engine.
# The engine never pushes to main; a human merges the PR once this gate is green.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    if: startsWith(github.head_ref, 'sync/upstream-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
      - name: Byte-compile and import
        run: |
          python -m compileall -q nextcloud_integration
          python -c "import nextcloud_integration"
